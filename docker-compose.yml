services:
  api:
    build:
      context: ./ClientesAPI
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING:?Copy .env.example to .env and set DB_CONNECTION_STRING}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8082:8080"

  frontend:
    build:
      context: ./ClientesBlazor
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ClientesAPI__BaseAddress: http://api:8080/
    ports:
      - "127.0.0.1:8081:8080"
